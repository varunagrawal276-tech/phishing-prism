[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "phishing-prism"
version = "0.1.0"
description = "PRISM-Phish: Source-Invariant and Perturbation-Consistent Phishing Email Detection Using Hybrid Transformer Representations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PRISM-Phish Research Team"},
]
keywords = ["phishing", "email", "detection", "transformer", "NLP", "cybersecurity"]

dependencies = [
    # Core ML
    "torch>=2.4",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "datasets>=2.18",
    "accelerate>=0.30",
    "safetensors>=0.4",

    # Classical ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",

    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=0.20",

    # Explainability
    "shap>=0.44",

    # NLP utilities
    "nltk>=3.8",
    "regex>=2024.4",

    # Near-duplicate detection
    "datasketch>=1.6",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",

    # Configuration
    "pyyaml>=6.0",
    "omegaconf>=2.3",

    # Utilities
    "tqdm>=4.66",
    "rich>=13.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "chardet>=5.2",
    "xxhash>=3.4",

    # Testing
    "pytest>=8.1",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
llm = [
    "bitsandbytes>=0.43",
    "auto-gptq>=0.7",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
